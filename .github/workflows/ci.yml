name: Test and Deploy Project

# Trigger tests on PRs, and deploy on push to main
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    container:
      image: node:20
    steps:
      # 1. Checkout the code
      - uses: actions/checkout@v3

      # 2. Install dependencies
      - run: npm ci

      # 3. Run tests
      - run: npm test

      # 4. Build project
      - run: npm run build

  deploy:
    needs: test-and-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - uses: actions/checkout@v3

      # 2. Set up SSH agent
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.1
        with:
          ssh-private-key: AAAAC3NzaC1lZDI1NTE5AAAAIOdWgBXON1hm3ApOjF4yWYGjIxQatUdnZSFhZKEWp9q

      # 3. Copy files to the server
      - name: Deploy files via SCP
        run: |
          scp -r ./ azureuser@:57.159.30.121/path/to/deploy/

      # 4. Restart server service
      - name: Restart service
        run: |
          ssh azureuser@:57.159.30.121 "sudo systemctl restart your-app-service"
