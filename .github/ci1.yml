name: Build and Deploy

# Trigger only on push to main
on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    container:
      image: node:20
    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 3. Run tests
      - name: Run tests
        run: npm test

      # 4. Build project
      - name: Build project
        run: npm run build

      # 5. Prepare build for deployment (zip folder)
      - name: Zip build folder
        run: zip -r build.zip ./build

  deploy:
    name: Deploy to Server
    needs: build-and-test       # Only run if build-and-test succeeds
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout code (needed for workflow context)
      - uses: actions/checkout@v3

      # 2. Set up SSH
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 3. Copy build to server
      - name: Upload build to server
        run: scp build.zip user@your-server-ip:/path/to/deploy/

      # 4. Extract and restart service
      - name: Deploy and restart
        run: |
          ssh user@your-server-ip "
            cd /path/to/deploy && \
            unzip -o build.zip && \
            rm build.zip && \
            sudo systemctl restart your-app-service
          "
